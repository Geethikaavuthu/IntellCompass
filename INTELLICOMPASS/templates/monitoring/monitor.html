{% extends "base.html" %}
{% load static %}
{% block title %}Engagement Monitoring - IntelliCompass{% endblock %}
{% block extra_head %}
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/face-landmarks-detection@1"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/blazeface@0"></script>
{% endblock %}
{% block content %}
<h2 class="mb-4"><i class="bi bi-camera-video me-2"></i>Engagement Monitoring</h2>

<div class="row">
    <div class="col-md-6">
        <div class="card border-0 shadow-sm p-3">
            <div class="position-relative">
                <video id="webcam" autoplay playsinline muted width="100%" class="rounded"></video>
                <canvas id="overlay" class="position-absolute top-0 start-0" style="pointer-events:none;"></canvas>
            </div>
            <div class="mt-3">
                <button id="startBtn" class="btn btn-success me-2"><i class="bi bi-play me-1"></i>Start</button>
                <button id="stopBtn" class="btn btn-danger" disabled><i class="bi bi-stop me-1"></i>Stop</button>
            </div>
        </div>
    </div>
    <div class="col-md-6">
        <div class="card border-0 shadow-sm p-4">
            <h5>Real-time Metrics</h5>
            <div class="mb-3">
                <label class="form-label">Attention Score</label>
                <div class="progress" style="height:25px;">
                    <div id="attentionBar" class="progress-bar bg-info" style="width:0%">0%</div>
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label">Detected Emotion</label>
                <div id="emotionDisplay" class="fs-4">—</div>
            </div>
            <div class="mb-3">
                <label class="form-label">Face Detected</label>
                <div id="faceStatus" class="badge bg-secondary">Waiting...</div>
            </div>
            <div>
                <label class="form-label">Session Duration</label>
                <div id="duration" class="fs-5">00:00</div>
            </div>
        </div>
    </div>
</div>

<script>
const lessonPk = {{ lesson_pk }};
const csrfToken = "{{ csrf_token }}";
let model = null;
let streaming = false;
let startTime = null;
let attentionScores = [];
let emotionCounts = {happy:0, sad:0, angry:0, bored:0, neutral:0, distracted:0};

const video = document.getElementById("webcam");
const startBtn = document.getElementById("startBtn");
const stopBtn = document.getElementById("stopBtn");

startBtn.onclick = async () => {
    const stream = await navigator.mediaDevices.getUserMedia({video:true});
    video.srcObject = stream;
    model = await blazeface.load();
    streaming = true;
    startTime = Date.now();
    startBtn.disabled = true;
    stopBtn.disabled = false;
    detect();
};

stopBtn.onclick = async () => {
    streaming = false;
    video.srcObject?.getTracks().forEach(t => t.stop());
    startBtn.disabled = false;
    stopBtn.disabled = true;

    const duration = Math.floor((Date.now() - startTime) / 1000);
    const avgAttention = attentionScores.length ? attentionScores.reduce((a,b)=>a+b,0)/attentionScores.length : 0;
    const dominant = Object.entries(emotionCounts).sort((a,b)=>b[1]-a[1])[0]?.[0] || "neutral";

    await fetch("/api/monitoring/save/", {
        method: "POST",
        headers: {"Content-Type":"application/json", "X-CSRFToken": csrfToken},
        body: JSON.stringify({
            lesson_id: lessonPk,
            attention_score: Math.round(avgAttention),
            emotion_score: 70,
            dominant_emotion: dominant,
            emotion_data: emotionCounts,
            attention_data: {scores: attentionScores.slice(-50)},
            duration: duration,
        })
    });
    alert("Engagement session saved!");
};

async function detect() {
    if (!streaming) return;
    const predictions = await model.estimateFaces(video, false);
    const faceStatus = document.getElementById("faceStatus");
    const attBar = document.getElementById("attentionBar");
    const emotionDiv = document.getElementById("emotionDisplay");

    if (predictions.length > 0) {
        faceStatus.className = "badge bg-success";
        faceStatus.textContent = "Detected ✓";

        // Simple attention: based on face position/size in frame
        const face = predictions[0];
        const centerX = (face.topLeft[0] + face.bottomRight[0]) / 2;
        const frameW = video.videoWidth;
        const offset = Math.abs(centerX - frameW/2) / (frameW/2);
        const attention = Math.max(0, Math.round((1 - offset) * 100));
        attentionScores.push(attention);
        attBar.style.width = attention + "%";
        attBar.textContent = attention + "%";
        attBar.className = `progress-bar ${attention > 60 ? 'bg-success' : attention > 30 ? 'bg-warning' : 'bg-danger'}`;

        // Simulated emotion (real emotion detection would need a separate model)
        const emotions = ["happy", "neutral", "bored", "distracted"];
        const emotion = attention > 70 ? "happy" : attention > 40 ? "neutral" : "distracted";
        emotionCounts[emotion]++;
        const emojis = {happy:"😊 Happy", sad:"😢 Sad", angry:"😠 Angry", bored:"😑 Bored", neutral:"😐 Neutral", distracted:"🤔 Distracted"};
        emotionDiv.textContent = emojis[emotion] || emotion;
    } else {
        faceStatus.className = "badge bg-danger";
        faceStatus.textContent = "No face";
        attentionScores.push(0);
        emotionCounts.distracted++;
    }

    // Duration
    if (startTime) {
        const s = Math.floor((Date.now()-startTime)/1000);
        document.getElementById("duration").textContent = `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;
    }

    requestAnimationFrame(detect);
}
</script>
{% endblock %}
