{% extends "base.html" %}
{% block title %}Recommendations - IntelliCompass{% endblock %}
{% block content %}
<h2 class="mb-4"><i class="bi bi-lightbulb me-2"></i>AI Recommendations</h2>
<p class="text-muted">Personalized suggestions based on your learning activity.</p>

<div id="recsContainer">
    <div class="text-center py-5">
        <button id="loadRecs" class="btn btn-primary btn-lg"><i class="bi bi-stars me-2"></i>Get AI Recommendations</button>
    </div>
</div>

<script>
document.getElementById("loadRecs").onclick = async function() {
    this.disabled = true;
    this.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Generating...';
    try {
        const res = await fetch("/api/recommendations/get/", {headers: {"X-CSRFToken": "{{ csrf_token }}"}});
        const data = await res.json();
        if (data.recommendations) {
            const container = document.getElementById("recsContainer");
            container.innerHTML = '<div class="row g-3">' + data.recommendations.map(r => `
                <div class="col-md-6">
                    <div class="card border-0 shadow-sm h-100">
                        <div class="card-body">
                            <span class="badge bg-${r.priority==='high'?'danger':r.priority==='medium'?'warning':'info'} mb-2">${r.priority} priority</span>
                            <h5>${r.title}</h5>
                            <p class="text-muted">${r.description}</p>
                            <small class="badge bg-secondary">${r.type}</small>
                        </div>
                    </div>
                </div>
            `).join("") + "</div>";
        } else {
            document.getElementById("recsContainer").innerHTML = '<p class="text-danger">Could not generate recommendations. Make sure Gemini API key is configured.</p>';
        }
    } catch(e) {
        document.getElementById("recsContainer").innerHTML = '<p class="text-danger">Error loading recommendations.</p>';
    }
};
</script>
{% endblock %}
