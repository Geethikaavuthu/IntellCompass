{% extends "base.html" %}
{% block title %}Set New Password - IntelliCompass{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card border-0 shadow-sm p-4">
      <h3 class="text-center mb-4">Set a new password</h3>
      <form method="post">
        {% csrf_token %}
        {% for field in form %}
        <div class="mb-3">
          <label class="form-label">{{ field.label }}</label>
          {{ field }}
          {% for error in field.errors %}<small class="text-danger">{{ error }}</small>{% endfor %}
        </div>
        {% endfor %}
        <button type="submit" class="btn btn-primary w-100 mt-2">Save new password</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
