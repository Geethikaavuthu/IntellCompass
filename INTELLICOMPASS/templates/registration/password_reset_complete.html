{% extends "base.html" %}
{% block title %}Password Reset Complete - IntelliCompass{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card border-0 shadow-sm p-4 text-center">
      <h3 class="mb-3">Password reset complete</h3>
      <p class="text-muted">Your password has been set. You can now log in with your new password.</p>
      <a class="btn btn-primary mt-3" href="{% url 'accounts:login' %}">Login</a>
    </div>
  </div>
</div>
{% endblock %}
