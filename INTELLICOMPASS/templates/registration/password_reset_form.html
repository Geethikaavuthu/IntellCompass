{% extends "base.html" %}
{% block title %}Reset Password - IntelliCompass{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card border-0 shadow-sm p-4">
      <h3 class="text-center mb-4">Reset your password</h3>
      <p class="text-muted">Enter your account email and we'll send a link to reset your password.</p>
      <form method="post">
        {% csrf_token %}
        {{ form.email.label_tag }}
        {{ form.email }}
        <button type="submit" class="btn btn-primary w-100 mt-3">Send reset link</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
