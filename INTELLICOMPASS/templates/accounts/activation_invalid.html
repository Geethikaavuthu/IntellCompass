{% extends "base.html" %}
{% block title %}Activation Invalid - IntelliCompass{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card border-0 shadow-sm p-4 text-center">
            <h3 class="mb-3">Activation Link Invalid</h3>
            <p class="text-muted">The activation link appears to be invalid or expired. Please try registering again or contact support.</p>
            <a class="btn btn-primary mt-3" href="{% url 'accounts:register' %}">Register</a>
        </div>
    </div>
</div>
{% endblock %}
