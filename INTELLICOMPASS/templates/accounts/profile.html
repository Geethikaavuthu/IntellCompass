{% extends "base.html" %}
{% block title %}Profile - IntelliCompass{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card border-0 shadow-sm p-4">
            <h3 class="mb-4"><i class="bi bi-person-gear me-2"></i>My Profile</h3>
            <div class="text-center mb-3">
                {% if user.avatar %}
                <img src="{{ user.avatar.url }}" class="rounded-circle" width="100" height="100" alt="Avatar">
                {% else %}
                <i class="bi bi-person-circle display-1 text-muted"></i>
                {% endif %}
                <p class="badge bg-primary mt-2">{{ user.get_role_display }}</p>
            </div>
            <form method="post" enctype="multipart/form-data">
                {% csrf_token %}
                {% for field in form %}
                <div class="mb-3">
                    <label class="form-label">{{ field.label }}</label>
                    {{ field }}
                </div>
                {% endfor %}
                <button type="submit" class="btn btn-primary w-100">Save Changes</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
